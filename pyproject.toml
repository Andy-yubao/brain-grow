[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "braingrow"
version = "0.0.0"
description = "Research workspace for joint neural parameter and structure optimization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "Pillow>=10,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
train = ["torch==2.13.0"]

[tool.setuptools]
package-dir = {"" = "src", "tools" = "tools"}

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["braingrow*", "tools*"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["src", "."]
